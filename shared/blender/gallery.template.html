<title>Moon Sweepers Concept Garage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a showroom floor. One bay per vehicle, grouped by line, each with its render, stats and a verdict. */
:root {
  --bg: #e9ecef; --panel: #f7f8f9; --ink: #1d2733; --muted: #5d6875; --line: #c9cfd6;
  --accent: #c8541b; --ok: #3d7a4f; --warn: #a8761a; --bad: #b3261e;
  --c-wide: #c8541b; --c-fast: #2f6f8f; --c-buggy: #7a4fa8;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151a20; --panel: #1e252d; --ink: #e3e8ee; --muted: #9aa5b1; --line: #33404c;
  --accent: #e8743a; --ok: #6fbf86; --warn: #d4b14a; --bad: #f07167;
  --c-wide: #e8743a; --c-fast: #7fbfdf; --c-buggy: #b994e0; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #151a20; --panel: #1e252d; --ink: #e3e8ee; --muted: #9aa5b1; --line: #33404c;
  --accent: #e8743a; --ok: #6fbf86; --warn: #d4b14a; --bad: #f07167;
  --c-wide: #e8743a; --c-fast: #7fbfdf; --c-buggy: #b994e0; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.5; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; max-width: 1300px; margin: 0 auto; display: grid; gap: 26px; }
header { border-bottom: 3px solid var(--ink); padding-bottom: 10px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 10px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 34px; text-transform: uppercase; letter-spacing: .02em; margin: 0; line-height: 1; }
h1 span { color: var(--accent); }
h2 { font-family: var(--display); font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: .06em; margin: 0; border-top: 6px solid var(--lc); padding-top: 6px; }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 70ch; }
.tally { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.line { display: grid; gap: 14px; }
.bays { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 14px; }
.bay { background: var(--panel); border: 1px solid var(--line); display: grid; min-width: 0; }
.shot { position: relative; background: #2a2d33; aspect-ratio: 16 / 10; overflow: hidden; }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; max-width: 100%; }
.views { position: absolute; right: 8px; bottom: 8px; display: flex; gap: 4px; }
.views button { font: 500 12px var(--display); text-transform: uppercase; letter-spacing: .06em; background: rgba(15, 18, 22, .7); color: #fff; border: 1px solid rgba(255, 255, 255, .25); padding: 2px 8px; cursor: pointer; border-radius: 2px; }
.views button[aria-pressed="true"] { background: #fff; color: #111; }
.tier { position: absolute; left: 8px; top: 8px; font: 700 13px var(--display); letter-spacing: .08em; text-transform: uppercase; background: var(--lc); color: #fff; padding: 1px 8px; border-radius: 2px; }
.info { padding: 12px 14px; display: grid; gap: 8px; }
.info h3 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .02em; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.info h3 small { font: 400 12px var(--mono); color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px 10px; font-variant-numeric: tabular-nums; }
.stats div { display: grid; }
.stats b { font-weight: 600; font-size: 15px; }
.stats span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.pitch { font-size: 13px; margin: 0; }
details summary { cursor: pointer; font-size: 12px; color: var(--muted); }
details pre { white-space: pre-wrap; font: 12px var(--mono); margin: 6px 0 0; max-height: 240px; overflow: auto; }
.verdict { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border-top: 1px solid var(--line); padding-top: 8px; }
.verdict button { font: 500 13px var(--body); cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 3px; padding: 3px 10px; }
.verdict button[data-v="love"][aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.verdict button[data-v="tweak"][aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: #111; }
.verdict button[data-v="redo"][aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #fff; }
.verdict input { flex: 1 1 160px; min-width: 0; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 4px 8px; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.note { font-size: 12px; color: var(--muted); }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Moon Sweepers <span>Concept Garage</span></h1>
      <p class="sub">First-pass models for every vehicle in the scaling sheet, built headless in Blender from the shared kit and rendered beside a 1.8 m astronaut. Mark each one so the next pass knows what to keep.</p>
    </div>
    <span class="tally" id="tally"></span>
  </header>
  <div id="lines"></div>
</div>

<script>
const DATA = /*DATA*/[];
const LINES = [["buggy", "Lunar buggy line", "var(--c-buggy)"], ["wide", "Wide line", "var(--c-wide)"], ["fast", "Fast line", "var(--c-fast)"]];
const VERDICTS = [["love", "Keep"], ["tweak", "Tweak"], ["redo", "Redo"]];
let db = null, verdicts = {};
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
const fmt = n => Number(n).toLocaleString("en-US");

function pitchOf(md) {
  const para = md.split(/\n\s*\n/).map(s => s.trim()).filter(s => s && !s.startsWith("#"));
  return (para[0] || "").replace(/\*\*|`/g, "").replace(/\s+/g, " ");
}

function render() {
  const box = document.getElementById("lines"); box.replaceChildren();
  for (const [key, label, col] of LINES) {
    const items = DATA.filter(d => d.stats && d.stats.line === key).sort((a, b) => a.stats.tier - b.stats.tier);
    if (!items.length) continue;
    const sec = el("section", "line"); sec.style.setProperty("--lc", col);
    sec.append(el("h2", null, label));
    const bays = el("div", "bays");
    for (const d of items) bays.append(bay(d, col));
    sec.append(bays); box.append(sec);
  }
  const rest = DATA.filter(d => !d.stats);
  if (rest.length) { const sec = el("section", "line"); sec.style.setProperty("--lc", "var(--muted)"); sec.append(el("h2", null, "Other")); const bays = el("div", "bays"); rest.forEach(d => bays.append(bay(d, "var(--muted)"))); sec.append(bays); box.append(sec); }
  tally();
}

function bay(d, col) {
  const b = el("article", "bay");
  const shot = el("div", "shot"); shot.style.setProperty("--lc", col);
  const img = el("img"); img.src = d.hero; img.alt = `${d.stats ? d.stats.name : d.folder}, three-quarter render`; shot.append(img);
  if (d.stats) shot.append(el("span", "tier", "Tier " + d.stats.tier));
  const views = el("div", "views");
  [["hero", "3/4"], ["rear", "Rear"], ["side", "Side"], ["front", "Front"]].filter(([k]) => d[k]).forEach(([k, lab], i) => {
    const btn = el("button", null, lab); btn.type = "button"; btn.setAttribute("aria-pressed", i === 0);
    btn.onclick = () => { img.src = d[k]; views.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === btn)); };
    views.append(btn);
  });
  shot.append(views); b.append(shot);
  const info = el("div", "info");
  const h = el("h3", null, d.stats ? d.stats.name : d.folder); h.append(el("small", null, d.id || d.folder)); info.append(h);
  if (d.stats) {
    const s = el("div", "stats");
    [["$" + fmt(d.stats.price), "price"], [d.stats.width + " m", "sweep"], [d.stats.speed + " m/s", "speed"], [fmt(d.stats.storageKg) + " kg", "hopper"]]
      .forEach(([v, k]) => { const c = el("div"); c.append(el("b", null, v), el("span", null, k)); s.append(c); });
    info.append(s);
  }
  if (d.concept) {
    info.append(el("p", "pitch", pitchOf(d.concept)));
    const det = el("details"); det.append(el("summary", null, "Full concept notes"), el("pre", null, d.concept)); info.append(det);
  }
  const key = d.id || d.folder, v = verdicts[key] || {};
  const row = el("div", "verdict");
  VERDICTS.forEach(([k, lab]) => {
    const btn = el("button", null, lab); btn.type = "button"; btn.dataset.v = k; btn.setAttribute("aria-pressed", v.status === k);
    btn.disabled = !db;
    btn.onclick = () => save(key, { status: v.status === k ? null : k, note: row.querySelector("input").value });
    row.append(btn);
  });
  const inp = el("input"); inp.id = "note-" + key.replace(/[^a-z0-9]/gi, "-"); inp.placeholder = db ? "What to change" : "Verdicts need the shared store"; inp.value = v.note || ""; inp.disabled = !db;
  inp.addEventListener("change", () => save(key, { status: (verdicts[key] || {}).status || null, note: inp.value }));
  row.append(inp); info.append(row);
  b.append(info);
  return b;
}

async function save(key, body) {
  verdicts[key] = body; render();
  try { await db.doc("verdicts/" + key.replace(/[^A-Za-z0-9_.-]/g, "-")).set({ ...body, id: key, updatedAt: new Date().toISOString() }); }
  catch (e) { document.getElementById("tally").textContent = "Couldn't save the verdict (" + (e.code || e.message) + ")."; }
}

function tally() {
  const n = DATA.length, c = { love: 0, tweak: 0, redo: 0 };
  Object.values(verdicts).forEach(v => { if (c[v.status] != null) c[v.status]++; });
  document.getElementById("tally").textContent = `${n} concepts · ${c.love} keep · ${c.tweak} tweak · ${c.redo} redo`;
}

render();
(async () => {
  db = await window.claude?.use?.("db");
  if (!db) { render(); return; }
  db.collection("verdicts").onSnapshot(snap => {
    verdicts = {}; snap.docs.forEach(d => { const v = d.data(); verdicts[v.id || d.id] = v; });
    const active = document.activeElement && document.activeElement.tagName === "INPUT";
    if (!active) render(); else tally();
  }, () => {});
  render();
})();
</script>
