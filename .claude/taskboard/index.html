<title>GarageLib Work Orders</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a hangar dispatch board. Status columns of work-order slips; each slip shows its file lock (paths) and who holds it. */
:root {
  --bg: #e9ecef; --panel: #f7f8f9; --ink: #1d2733; --muted: #5d6875; --line: #c9cfd6;
  --accent: #c8541b; --accent-ink: #fff;
  --open: #4a6b8a; --claimed: #c8541b; --review: #8a6d12; --done: #3d7a4f; --stale: #b3261e;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151a20; --panel: #1e252d; --ink: #e3e8ee; --muted: #9aa5b1; --line: #33404c;
  --accent: #e8743a; --accent-ink: #1a0d05;
  --open: #82a7c9; --claimed: #e8743a; --review: #d4b14a; --done: #6fbf86; --stale: #f07167; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #151a20; --panel: #1e252d; --ink: #e3e8ee; --muted: #9aa5b1; --line: #33404c;
  --accent: #e8743a; --accent-ink: #1a0d05;
  --open: #82a7c9; --claimed: #e8743a; --review: #d4b14a; --done: #6fbf86; --stale: #f07167; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; max-width: 1400px; margin: 0 auto; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; border-bottom: 3px solid var(--ink); padding-bottom: 10px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 34px; letter-spacing: .02em; text-transform: uppercase; margin: 0; line-height: 1; text-wrap: balance; }
h1 span { color: var(--accent); }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 65ch; }
.status-line { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
select, input, textarea, button { font: inherit; color: var(--ink); }
select, input, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; min-width: 0; }
button { cursor: pointer; border: 1px solid var(--ink); background: transparent; border-radius: 3px; padding: 5px 10px; font-weight: 500; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1000px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .board { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 10px; align-content: start; min-width: 0; }
.col h2 { font-family: var(--display); font-weight: 700; font-size: 18px; text-transform: uppercase; letter-spacing: .08em; margin: 0; display: flex; justify-content: space-between; border-top: 6px solid var(--c); padding-top: 6px; }
.col h2 .n { font-variant-numeric: tabular-nums; color: var(--muted); }
.slip { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 2px; padding: 10px 12px; display: grid; gap: 6px; min-width: 0; }
.slip .top { display: flex; gap: 8px; justify-content: space-between; align-items: baseline; }
.slip .id { font-family: var(--mono); font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.slip h3 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.3; }
.area { font-family: var(--display); font-weight: 500; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--c); white-space: nowrap; }
.paths { font-family: var(--mono); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px; }
.paths code { background: var(--bg); border: 1px solid var(--line); padding: 1px 5px; border-radius: 2px; overflow-wrap: anywhere; }
.meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.meta b { color: var(--ink); font-weight: 500; }
.notes { font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.stale { color: var(--stale); font-weight: 600; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.actions button { font-size: 12px; padding: 3px 8px; }
.empty { color: var(--muted); font-size: 13px; border: 1px dashed var(--line); padding: 12px; border-radius: 2px; }
details.new { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 10px 14px; }
details.new summary { cursor: pointer; font-weight: 600; }
form { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-top: 10px; }
form label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
form .wide { grid-column: 1 / -1; }
.msg { font-size: 13px; color: var(--stale); }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>GarageLib <span>Work Orders</span></h1>
      <p class="sub">Shared task lock for everyone (and every AI) working in MoonSweepers-GarageLib. Claim a slip before touching its paths; release it when the PR is up or you stop.</p>
    </div>
    <div class="controls">
      <label for="area-filter" class="status-line">Area</label>
      <select id="area-filter"><option value="">All areas</option></select>
      <label class="status-line"><input type="checkbox" id="show-done"> show done</label>
      <span class="status-line" id="status">Connecting…</span>
    </div>
  </header>

  <details class="new" id="new-box">
    <summary>New work order</summary>
    <form id="new-form">
      <label>Title<input id="f-title" required maxlength="140" placeholder="Rover X: suspension tuning"></label>
      <label>Area<input id="f-area" required placeholder="core, vehicle/RoverX, tooling, docs"></label>
      <label class="wide">Paths it locks (comma separated)<input id="f-paths" placeholder="vehicles/RoverX/**, src/GarageLib/VehicleDefinition.cs"></label>
      <label class="wide">Notes<textarea id="f-notes" rows="2"></textarea></label>
      <div class="actions"><button class="primary" type="submit">Add</button><span class="msg" id="form-msg"></span></div>
    </form>
  </details>

  <div class="board" id="board"></div>
</div>

<script>
const COLS = [["open", "Open"], ["claimed", "Claimed"], ["review", "In review"], ["done", "Done"]];
const STALE_MS = 24 * 3600e3;
const boardEl = document.getElementById("board"), statusEl = document.getElementById("status");
const areaSel = document.getElementById("area-filter"), showDone = document.getElementById("show-done");
let tasks = [], db = null, readOnly = true;

try { showDone.checked = localStorage.getItem("wo-done") === "1"; areaSel.dataset.want = localStorage.getItem("wo-area") || ""; } catch {}

function ago(iso) {
  if (!iso) return "";
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (!isFinite(s)) return "";
  if (s < 90) return "just now";
  if (s < 5400) return Math.round(s / 60) + " min ago";
  if (s < 129600) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " d ago";
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function render() {
  const areas = [...new Set(tasks.map(t => t.area).filter(Boolean))].sort();
  const want = areaSel.value || areaSel.dataset.want || "";
  areaSel.replaceChildren(new Option("All areas", ""), ...areas.map(a => new Option(a, a)));
  areaSel.value = areas.includes(want) ? want : "";
  const shown = tasks.filter(t => !areaSel.value || t.area === areaSel.value);
  boardEl.replaceChildren();
  for (const [key, label] of COLS) {
    if (key === "done" && !showDone.checked) continue;
    const col = el("section", "col"); col.style.setProperty("--c", `var(--${key})`);
    const items = shown.filter(t => (t.status || "open") === key)
      .sort((a, b) => (b.updatedAt || "").localeCompare(a.updatedAt || ""));
    const h = el("h2", null, label); h.append(el("span", "n", String(items.length))); col.append(h);
    if (!items.length) col.append(el("div", "empty", key === "open" ? "Nothing open. Add a work order above, or ask Claude to file one." : "None."));
    for (const t of items) col.append(slip(t, key));
    boardEl.append(col);
  }
  if (!showDone.checked) {
    const n = shown.filter(t => t.status === "done").length;
    if (n) statusEl.dataset.done = n;
  }
}

function slip(t, key) {
  const s = el("article", "slip"); s.style.setProperty("--c", `var(--${key})`);
  const top = el("div", "top"); top.append(el("span", "id", t.id), el("span", "area", t.area || "—")); s.append(top);
  s.append(el("h3", null, t.title || "(untitled)"));
  if (Array.isArray(t.paths) && t.paths.length) { const p = el("div", "paths"); t.paths.forEach(x => p.append(el("code", null, x))); s.append(p); }
  const m = el("div", "meta");
  if (t.claimedBy && key !== "open") { const b = el("span"); b.append("held by ", el("b", null, t.claimedBy)); m.append(b); }
  if (t.branch) { const b = el("span"); b.append("branch ", el("b", null, t.branch)); m.append(b); }
  if (t.pr) m.append(el("span", null, t.pr));
  const beat = t.heartbeatAt || t.claimedAt;
  if (key === "claimed" && beat && Date.now() - Date.parse(beat) > STALE_MS) m.append(el("span", "stale", "stale · last seen " + ago(beat)));
  else if (t.updatedAt) m.append(el("span", null, "updated " + ago(t.updatedAt)));
  if (m.childNodes.length) s.append(m);
  if (t.notes) s.append(el("div", "notes", t.notes));
  if (!readOnly) {
    const a = el("div", "actions");
    const go = (label, patch) => { const b = el("button", null, label); b.type = "button"; b.onclick = () => change(t, patch, b); a.append(b); };
    if (key === "claimed" || key === "review") go("Release", { status: "open", claimedBy: null, branch: null, claimedAt: null, heartbeatAt: null });
    if (key !== "done") go("Mark done", { status: "done" });
    if (key === "done") go("Reopen", { status: "open", claimedBy: null });
    s.append(a);
  }
  return s;
}

async function change(t, patch, btn) {
  btn.disabled = true;
  const body = { ...patch, updatedAt: new Date().toISOString() };
  for (const k of Object.keys(body)) if (body[k] === null) delete body[k];
  const clear = Object.keys(patch).filter(k => patch[k] === null);
  try {
    const ref = db.doc("tasks/" + t.id), cur = (await ref.get()).data() || {};
    const next = { ...cur, ...body }; clear.forEach(k => delete next[k]);
    await ref.set(next);
  } catch (e) { statusEl.textContent = "Couldn't save: " + (e.code || e.message); btn.disabled = false; }
}

document.getElementById("new-form").addEventListener("submit", async ev => {
  ev.preventDefault();
  const msg = document.getElementById("form-msg"); msg.textContent = "";
  const title = document.getElementById("f-title").value.trim(), area = document.getElementById("f-area").value.trim();
  const paths = document.getElementById("f-paths").value.split(",").map(x => x.trim()).filter(Boolean);
  const notes = document.getElementById("f-notes").value.trim();
  const id = (area + "-" + title).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60);
  if (tasks.some(t => t.id === id)) { msg.textContent = "A work order with that id already exists."; return; }
  const now = new Date().toISOString();
  try {
    await db.doc("tasks/" + id).set({ title, area, paths, notes, status: "open", createdBy: "board", createdAt: now, updatedAt: now });
    ev.target.reset();
  } catch (e) { msg.textContent = "Couldn't add it: " + (e.code || e.message); }
});

areaSel.addEventListener("change", () => { try { localStorage.setItem("wo-area", areaSel.value); } catch {} render(); });
showDone.addEventListener("change", () => { try { localStorage.setItem("wo-done", showDone.checked ? "1" : "0"); } catch {} render(); });

render();
(async () => {
  db = await window.claude?.use?.("db");
  if (!db) { statusEl.textContent = "Board data isn't available in this view."; document.getElementById("new-box").hidden = true; return; }
  const user = await window.claude.use("user");
  const can = user ? await user.can("data.write") : null;
  readOnly = can === false;
  if (readOnly) document.getElementById("new-box").hidden = true;
  const timer = setTimeout(() => { statusEl.textContent = "Can't reach the board data yet."; }, 10000);
  db.collection("tasks").onSnapshot(snap => {
    if (!snap.metadata.fromCache) clearTimeout(timer);
    tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const live = tasks.filter(t => t.status === "claimed").length;
    statusEl.textContent = `${tasks.length} work orders · ${live} claimed${snap.metadata.fromCache ? " · syncing" : ""}`;
    render();
  }, e => { clearTimeout(timer); statusEl.textContent = "Board data stopped updating (" + e.code + "). Reload to reconnect."; });
})();
setInterval(render, 60000);
</script>
